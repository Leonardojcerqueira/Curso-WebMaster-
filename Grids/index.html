<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Animate.css</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
</head>
<style type="text/css">
      #meuid{
          animation-duration: 10s;
          animation-delay: 2s;
          animation-iteration-count: infinite;
          position:absolute;
          left: 300px;
          top: 300px;
        }
</style>
<body>
   <p class="animate__animated animate__bounce">Olá Mundo</p>
   <h1 id="meuid" class="animate__animated animate__rotateIn animate__flash">Olá Danki Code</h1>
    

</body>
</html>
